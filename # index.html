<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Demo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #fafafa;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 100%;
  max-width: 350px;
  background: white;
  border: 1px solid #dbdbdb;
  padding: 40px 35px;
  text-align: center;
}

.logo {
  font-family: cursive;
  font-size: 48px;
  margin-bottom: 35px;
}

input {
  width: 100%;
  height: 45px;
  margin-bottom: 10px;
  padding: 12px;
  border: 1px solid #dbdbdb;
  border-radius: 5px;
  background: #fafafa;
  font-size: 14px;
}

button {
  width: 100%;
  height: 42px;
  margin-top: 8px;
  border: none;
  border-radius: 7px;
  background: #3897f0;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  opacity: 0.8;
}

#message {
  display: none;
  margin-top: 20px;
  padding: 12px;
  border-radius: 6px;
  background: #f0f0f0;
  font-size: 14px;
  font-weight: bold;
}

.demo {
  margin-top: 25px;
  color: #777;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">Instagram</div>

  <input
    type="text"
    placeholder="Phone number, username, or email"
    autocomplete="off"
  >

  <input
    type="password"
    placeholder="Password"
    autocomplete="off"
  >

  <button onclick="demoLogin()">Log In</button>

  <div id="message">
    😂 Demo only!<br>
    Koi password save ya send nahi hua.
  </div>

  <div class="demo">
    This is a harmless practice demo.
  </div>

</div>

<script>
function demoLogin() {
  document.getElementById("message").style.display = "block";
}
</script>

</body>
    </html>
